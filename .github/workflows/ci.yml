name: Testy CI

on:
  push:
    branches:
      - main
      - feat/testy-integration
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm run ci

      - name: Validate GL-EYE integration scenario
        run: |
          pnpm run scenario:prepare
          pnpm --filter @testy/scenario-engine exec node dist/cli.js validate ../../scenarios/customer-alpha-gl-eye-local.yaml
