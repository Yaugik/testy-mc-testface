name: Testy CI

on:
  push:
    branches:
      - main
      - feat/testy-integration
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint integration surface
        run: |
          pnpm exec eslint \
            adapters/gl-eye/src/adapter.ts \
            adapters/gl-eye/test/adapter.test.ts \
            apps/control-plane/src/platform-actions.ts \
            packages/browser-runner/src/index.ts \
            packages/browser-runner/src/network.ts \
            packages/browser-runner/src/runner.ts \
            packages/browser-runner/src/types.ts \
            packages/platform-actions/src/browser-actions.ts \
            packages/platform-actions/src/types.ts \
            packages/platform-actions/test/registry.test.ts \
            packages/target-adapter/src/fake.ts \
            packages/target-adapter/src/index.ts \
            packages/target-adapter/src/scenario-actions.ts \
            packages/target-adapter/src/types.ts \
            packages/target-adapter/test/target-adapter.test.ts

      - name: Typecheck integration packages
        run: |
          pnpm --filter @testy/browser-runner typecheck
          pnpm --filter @testy/target-adapter typecheck
          pnpm --filter @testy/platform-actions typecheck
          pnpm --filter @testy/gl-eye-adapter typecheck
          pnpm --filter @testy/control-plane typecheck

      - name: Test integration packages
        run: |
          pnpm --filter @testy/browser-runner test
          pnpm --filter @testy/target-adapter test
          pnpm --filter @testy/platform-actions test
          pnpm --filter @testy/gl-eye-adapter test
          pnpm --filter @testy/control-plane test

      - name: Build repository
        run: pnpm build

      - name: Validate GL-EYE integration scenario
        run: |
          pnpm run scenario:prepare
          pnpm --filter @testy/scenario-engine exec node dist/cli.js validate ../../scenarios/customer-alpha-gl-eye-local.yaml
