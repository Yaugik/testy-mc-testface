schemaVersion: "1.0"
site:
  id: alpha-marketing-site
  displayName: Northstar Cloud
  hostname: customer-alpha.test
variables:
  brandName: Northstar Cloud
tracking:
  enabled: true
  endpoint: /__testy/events
consent:
  id: analytics-consent
  text: We use analytics cookies to understand how visitors use Northstar Cloud.
  storage: cookie
  key: testy_consent
  acceptText: Accept analytics
  rejectText: Not now
  acceptTestId: accept-consent
  rejectTestId: reject-consent
pages:
  - id: home
    path: /
    title: Northstar Cloud — Turn product interest into pipeline
    blocks:
      - id: hero-heading
        type: heading
        level: 1
        text: Turn website interest into your next best conversation.
        testId: hero-heading
      - id: hero-copy
        type: text
        text: Northstar Cloud helps B2B revenue teams understand which companies are researching, what they care about, and when to reach out.
        testId: hero-copy
      - id: pricing-link
        type: link
        text: See pricing
        href: /pricing
        testId: pricing-link
      - id: contact-link
        type: link
        text: Book a demo
        href: /contact
        testId: contact-link

      - id: trust-heading
        type: heading
        level: 2
        text: Revenue teams use Northstar to turn anonymous traffic into account context.
        testId: trust-heading
      - id: trust-copy
        type: text
        text: Bring identification, intent, enrichment, and routing into one view so sales can act while interest is still warm.
        testId: trust-copy

      - id: metric-pipeline-heading
        type: heading
        level: 2
        text: 31% more qualified conversations
        testId: metric-pipeline-heading
      - id: metric-pipeline-copy
        type: text
        text: Focus outreach on accounts showing repeat research and buying-stage behavior.
        testId: metric-pipeline-copy
      - id: metric-speed-heading
        type: heading
        level: 2
        text: 7.4 hours saved per rep each week
        testId: metric-speed-heading
      - id: metric-speed-copy
        type: text
        text: Replace manual account research with a compact, enriched activity timeline.
        testId: metric-speed-copy
      - id: metric-confidence-heading
        type: heading
        level: 2
        text: 92% high-confidence account matches
        testId: metric-confidence-heading
      - id: metric-confidence-copy
        type: text
        text: Prioritize signals with transparent confidence instead of treating every visit the same.
        testId: metric-confidence-copy

      - id: capabilities-heading
        type: heading
        level: 2
        text: Everything your team needs to move from signal to action
        testId: capabilities-heading
      - id: capabilities-copy
        type: text
        text: Northstar connects first-party website activity with account intelligence so your team sees what changed, why it matters, and what to do next.
        testId: capabilities-copy

      - id: intelligence-heading
        type: heading
        level: 2
        text: Account intelligence that arrives with context
        testId: intelligence-heading
      - id: intelligence-copy
        type: text
        text: See visits, intent, company confidence, enrichment, and buying signals together so your team can move from anonymous traffic to informed outreach.
        testId: intelligence-copy
      - id: workflow-heading
        type: heading
        level: 2
        text: From first visit to sales-ready
        testId: workflow-heading
      - id: workflow-copy
        type: text
        text: Connect web behavior with account data, route qualified opportunities, and keep your team focused on the companies most likely to engage.
        testId: workflow-copy
      - id: signal-heading
        type: heading
        level: 2
        text: Understand what the account actually cares about
        testId: signal-heading
      - id: signal-copy
        type: text
        text: Group page views into meaningful themes like pricing, integrations, security, and product depth instead of handing sales a raw clickstream.
        testId: signal-copy
      - id: routing-heading
        type: heading
        level: 2
        text: Route the right account to the right owner
        testId: routing-heading
      - id: routing-copy
        type: text
        text: Combine confidence, fit, and recent behavior to surface the accounts that deserve attention now.
        testId: routing-copy
      - id: integrations-heading
        type: heading
        level: 2
        text: Fits the systems your team already uses
        testId: integrations-heading
      - id: integrations-copy
        type: text
        text: Keep Northstar alongside your CRM, enrichment providers, exports, and sales workflow without forcing another disconnected process.
        testId: integrations-copy
      - id: activation-heading
        type: heading
        level: 2
        text: Give sales a useful reason to reach out
        testId: activation-heading
      - id: activation-copy
        type: text
        text: Turn research patterns into concise talking points so outreach starts with relevance instead of a generic sequence.
        testId: activation-copy

      - id: proof-heading
        type: heading
        level: 2
        text: “Northstar made website intent usable for the whole revenue team.”
        testId: proof-heading
      - id: proof-copy
        type: text
        text: A fictional VP Revenue at Halcyon Systems — “We finally have one place to understand who is visiting, what changed, and whether the signal is strong enough for sales to act.”
        testId: proof-copy

      - id: final-cta-heading
        type: heading
        level: 2
        text: See what your highest-intent accounts are doing right now.
        testId: final-cta-heading
      - id: final-cta-copy
        type: text
        text: Explore the workflow with your own go-to-market motion and see how identification, enrichment, scoring, and routing work together.
        testId: final-cta-copy
      - id: final-cta-link
        type: link
        text: Book a tailored demo
        href: /contact
        testId: final-cta-link

