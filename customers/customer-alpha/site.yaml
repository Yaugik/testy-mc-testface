  - id: contact
    path: /contact
    title: Book a demo — Northstar Cloud
    blocks:
      - id: contact-heading
        type: heading
        level: 1
        text: See Northstar Cloud with your own go-to-market motion.
        testId: contact-heading
      - id: contact-copy
        type: text
        text: Tell us a little about your team. We’ll show how company identification, intent, enrichment, and routing can fit into your workflow.
        testId: contact-copy

      - id: lead-form
        type: form
        method: POST
        action: /contact/submit
        successPath: /thanks
        testId: lead-form
        fields:
          - id: work-email
            type: email
            name: work_email
            label: Work email
            placeholder: you@company.com
            testId: work-email
            required: true
          - id: company-size
            type: select
            name: company_size
            label: Company size
            testId: company-size
            required: true
            value: medium
            options:
              - value: small
                label: 1–49 employees
              - value: medium
                label: 50–249 employees
              - value: large
                label: 250+ employees
          - id: product-updates
            type: checkbox
            name: product_updates
            label: Send me practical product and revenue-intelligence updates
            testId: product-updates
            value: "yes"
        submit:
          text: Book my demo
          testId: submit-lead

      - id: contact-expect-heading
        type: heading
        level: 2
        text: What happens in the demo
        testId: contact-expect-heading
      - id: contact-expect-copy
        type: text
        text: We’ll walk through identification, account timelines, scoring, enrichment, and routing using a sample motion close to yours. No generic 45-slide deck.
        testId: contact-expect-copy
      - id: contact-proof-heading
        type: heading
        level: 2
        text: Bring a real question from your pipeline
        testId: contact-proof-heading
      - id: contact-proof-copy
        type: text
        text: We can model how Northstar would handle repeat research, pricing-page intent, target-account visits, and sales handoff for a representative account.
        testId: contact-proof-copy
      - id: contact-time-heading
        type: heading
        level: 2
        text: 30 minutes, tailored to your team
        testId: contact-time-heading
      - id: contact-time-copy
        type: text
        text: Most teams leave with a clear view of where Northstar fits, what data it needs, and which plan makes sense.
        testId: contact-time-copy

  - id: thanks
    path: /thanks
    title: Thank you — Northstar Cloud
    blocks:
      - id: thanks-heading
        type: heading
        level: 1
        text: You’re all set.
        testId: thanks-heading
      - id: thanks-copy
        type: text
        text: Thanks for reaching out. Our team will follow up with a tailored Northstar Cloud walkthrough.
