x-testy-image: &testy-image "testy-mctestface:${TESTY_IMAGE_TAG:-latest}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testy
      POSTGRES_USER: testy
      POSTGRES_PASSWORD: "${TESTY_POSTGRES_PASSWORD:?}"
    volumes:
      - testy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testy -d testy"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      testy-platform:
        aliases:
          - testy-postgres

  traffic-gateway:
    image: *testy-image
    pull_policy: never
    command: ["pnpm", "--filter", "@testy/traffic-gateway-app", "start"]
    environment:
      TESTY_GATEWAY_HOST: 0.0.0.0
      TESTY_GATEWAY_PORT: 3100
      TESTY_GATEWAY_ADMIN_TOKEN: "${TESTY_GATEWAY_ADMIN_TOKEN:?}"
      TESTY_GATEWAY_ALLOWED_TARGET_ORIGINS: "http://gl-eye-app:8000"
      TESTY_GATEWAY_BLOCKED_PROVIDER_HOSTS: "${TESTY_GATEWAY_BLOCKED_PROVIDER_HOSTS:-}"
      TESTY_GATEWAY_MAX_ROUTE_TTL_MS: "${TESTY_GATEWAY_MAX_ROUTE_TTL_MS:-86400000}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3100/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - testy-platform
      - testy-gl-eye

  control-plane:
    image: *testy-image
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTROL_PLANE_HOST: 0.0.0.0
      CONTROL_PLANE_PORT: 3000
      DATABASE_URL: "postgresql://testy:${TESTY_POSTGRES_PASSWORD:?}@testy-postgres:5432/testy"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SCENARIOS_DIR: /workspace/scenarios
      VENDOR_PACKAGES_DIR: /workspace/vendors
      BROWSER_PACKAGES_DIR: /workspace/customers
      GENERATED_RUNS_DIR: /var/lib/testy/generated/runs
      TESTY_IMPOSTER_IMAGE: "${TESTY_IMPOSTER_IMAGE:-outofcoffee/imposter:5}"
      TESTY_DOCKER_NETWORK: "${TESTY_GL_EYE_NETWORK:-testy-gl-eye}"
      TESTY_BROWSER: "${TESTY_BROWSER:-chromium}"
      TESTY_HEADLESS: "${TESTY_HEADLESS:-true}"
      TESTY_PUBLIC_CONTROL_PLANE_PORT: "${TESTY_PUBLIC_CONTROL_PLANE_PORT:-3000}"
      TESTY_PUBLIC_DEMO_BASE_URL: "${TESTY_PUBLIC_DEMO_BASE_URL:-}"
      TESTY_DEMO_SESSION_TTL_MS: "${TESTY_DEMO_SESSION_TTL_MS:-14400000}"
      TESTY_MAINTENANCE_INTERVAL_MS: "${TESTY_MAINTENANCE_INTERVAL_MS:-60000}"
      TESTY_MAINTENANCE_BATCH_SIZE: "${TESTY_MAINTENANCE_BATCH_SIZE:-100}"
      TESTY_MAINTENANCE_CLAIM_TTL_MS: "${TESTY_MAINTENANCE_CLAIM_TTL_MS:-300000}"
      TESTY_ARTIFACT_RETENTION_MS: "${TESTY_ARTIFACT_RETENTION_MS:-604800000}"
      TESTY_MAINTENANCE_ADMIN_TOKEN: "${TESTY_MAINTENANCE_ADMIN_TOKEN:?}"
      TESTY_TARGET_ADAPTER: gl-eye
      TESTY_GATEWAY_ADMIN_URL: http://traffic-gateway:3100
      TESTY_GATEWAY_ADMIN_TOKEN: "${TESTY_GATEWAY_ADMIN_TOKEN:?}"
      GL_EYE_BASE_URL: http://gl-eye-app:8000
      GL_EYE_ENVIRONMENT: testing
      GL_EYE_TEST_SUPPORT_TOKEN: "${GL_EYE_TEST_SUPPORT_TOKEN:?}"
      GL_EYE_ALLOWED_ORIGINS: http://gl-eye-app:8000
    expose:
      - "3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/testy/generated:/var/lib/testy/generated
    depends_on:
      postgres:
        condition: service_healthy
      traffic-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/v1/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - testy-platform
      - testy-gl-eye
      - coolify

volumes:
  testy_postgres_data:

networks:
  testy-platform:
    internal: true
  testy-gl-eye:
    external: true
    name: "${TESTY_GL_EYE_NETWORK:-testy-gl-eye}"
  coolify:
    external: true
    name: "${COOLIFY_NETWORK:-coolify}"
